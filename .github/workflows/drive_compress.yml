name: MHBD Drive Video Compressor Pipeline

on:
  repository_dispatch:
    types: [drive_compress_job]
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID'
        required: true

concurrency:
  group: mhbd-drive-compressor
  cancel-in-progress: false

jobs:
  compress-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fast Free Disk Space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL &
          disown
          df -h /

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg, FFprobe, Aria2, and Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg aria2 curl jq
          pip install --no-cache-dir requests urllib3

      - name: Run Video Compressor & Drive Uploader
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          if [ -f "drive_compress_worker.py" ]; then
            python3 drive_compress_worker.py
          elif [ -f "scripts/process_drive_compress.py" ]; then
            python3 scripts/process_drive_compress.py
          else
            echo "Worker script not found!"
            exit 1
          fi
